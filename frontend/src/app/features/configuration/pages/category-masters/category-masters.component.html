<div class="p-6 space-y-6" *ngIf="currentCategory">
    <!-- Breadcrumb & Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-1">
                <span (click)="goBack()" class="hover:text-blue-600 cursor-pointer">Configuration Masters</span>
                <i class="pi pi-chevron-right text-[10px]"></i>
                <span class="font-semibold text-slate-800 dark:text-slate-200">{{ currentCategory.title }}</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">{{ currentCategory.title }} Masters</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Manage sub-masters under {{ currentCategory.title }}</p>
        </div>
        <p-button label="Back to Categories" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (click)="goBack()"></p-button>
    </div>

    <!-- Sub-masters Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <div *ngFor="let sub of currentCategory.subMasters" 
             (click)="openSubMaster(sub)"
             class="bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-5 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between group">
            
            <div class="flex items-start gap-4 mb-4">
                <div [class]="currentCategory.iconBgClass + ' w-12 h-12 rounded-xl flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform'">
                    <i [class]="sub.icon + ' text-xl ' + currentCategory.iconColorClass"></i>
                </div>
                <div>
                    <h3 class="text-base font-semibold text-slate-800 dark:text-slate-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                        {{ sub.title }}
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2">
                        {{ sub.description }}
                    </p>
                </div>
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 group-hover:translate-x-1 transition-transform inline-flex items-center">
                    Manage Master <i class="pi pi-chevron-right ml-1 text-[10px]"></i>
                </span>
                <span *ngIf="sub.customRoute" class="text-[10px] font-semibold bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300 px-2 py-0.5 rounded-full">
                    Custom Dedicated
                </span>
            </div>
        </div>
    </div>
</div>
