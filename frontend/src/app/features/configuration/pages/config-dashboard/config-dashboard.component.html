<div class="p-6 space-y-6">
    <!-- Header -->
    <div>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Configuration Masters</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Select a category to manage master configurations easily</p>
    </div>

    <!-- 13 Categories Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-5">
        <div *ngFor="let cat of categories" 
             (click)="openCategory(cat)"
             class="bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/60 rounded-2xl p-5 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between group">
            
            <div class="flex items-start justify-between mb-4">
                <h3 class="text-xl font-semibold text-slate-800 dark:text-slate-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                    {{ cat.title }}
                </h3>
                <div [class]="cat.iconBgClass + ' w-11 h-11 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110'">
                    <i [class]="cat.icon + ' text-xl ' + cat.iconColorClass"></i>
                </div>
            </div>

            <div>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mb-4 line-clamp-2">
                    {{ cat.subtitle }}
                </p>
                <div class="inline-flex items-center text-xs font-semibold text-blue-600 dark:text-blue-400 group-hover:translate-x-1 transition-transform">
                    <span>Open {{ cat.title }} Masters</span>
                    <i class="pi pi-arrow-right ml-1.5 text-[10px]"></i>
                </div>
            </div>
        </div>
    </div>
</div>
