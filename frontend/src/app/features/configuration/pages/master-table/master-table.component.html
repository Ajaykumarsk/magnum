<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-6 space-y-6" *ngIf="config">
    <!-- Header & Navigation -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-1">
                <span (click)="router.navigate(['/configuration'])" class="hover:text-blue-600 cursor-pointer">Configuration</span>
                <i class="pi pi-chevron-right text-[10px]"></i>
                <span (click)="goBack()" class="hover:text-blue-600 cursor-pointer capitalize">{{ categoryKey }}</span>
                <i class="pi pi-chevron-right text-[10px]"></i>
                <span class="font-semibold text-slate-800 dark:text-slate-200">{{ config.title }}</span>
            </div>
           
        </div>
        
    </div>
</div>
<input type="file" #fileInput (change)="onFileImport($event)" accept=".csv" class="hidden">

<div class="p-6 space-y-4" *ngIf="config">
    
    <!-- Outer Card Wrapper matching exact screenshot style -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm p-5 space-y-4">
        
        <!-- Top Action Bar (+ New | Delete ---------------- Three-Dots Menu) -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/60">
            <div class="flex items-center gap-2">
                <p-button 
                    label="New" 
                    icon="pi pi-plus" 
                    [outlined]="true" 
                    severity="secondary" 
                    size="small"
                    (click)="openNew()">
                </p-button>

                <p-button 
                    label="Delete" 
                    icon="pi pi-trash" 
                    [outlined]="true" 
                    [severity]="selectedItems.length ? 'danger' : 'secondary'" 
                    [disabled]="!selectedItems.length"
                    size="small"
                    (click)="deleteSelected()">
                </p-button>
            </div>

            <div class="flex items-center gap-2">
                <p-button 
                    icon="pi pi-download" 
                    [outlined]="true" 
                    severity="secondary" 
                    size="small"
                    (click)="actionMenu.toggle($event)">
                </p-button>

                <!-- Dropdown Popover Menu -->
                <p-popover #actionMenu>
                    <div class="flex flex-col py-1 min-w-[170px]">
                        <button (click)="triggerImport(); actionMenu.hide()" 
                                class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/70 rounded-lg text-left transition-colors">
                            <i class="pi pi-sign-in text-blue-500 text-sm"></i>
                            <span>Import CSV</span>
                        </button>

                        <button (click)="downloadTemplate(); actionMenu.hide()" 
                                class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/70 rounded-lg text-left transition-colors">
                            <i class="pi pi-download text-emerald-500 text-sm"></i>
                            <span>Download Template</span>
                        </button>

                        <button (click)="exportCsv(); actionMenu.hide()" 
                                class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/70 rounded-lg text-left transition-colors">
                            <i class="pi pi-upload text-purple-500 text-sm"></i>
                            <span>Export CSV</span>
                        </button>
                    </div>
                </p-popover>
            </div>
        </div>

        <!-- Heading & Global Search Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-1">
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">
                Manage {{ getPluralTitle(config.title) }}
            </h2>

            <div class="relative w-full sm:w-72">
                <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 z-10 pointer-events-none text-sm"></i>
                <input 
                    pInputText 
                    type="text" 
                    (input)="dt.filterGlobal($any($event.target).value, 'contains')" 
                    placeholder="Search records..." 
                    class="w-full !pl-9 p-inputtext-sm rounded-xl">
            </div>
        </div>

        <!-- Data Table -->
        <p-table 
            #dt
            [value]="items" 
            [(selection)]="selectedItems"
            [rows]="10" 
            [paginator]="true" 
            [loading]="loading"
            [globalFilterFields]="['code', 'name']"
            [rowHover]="true"
            dataKey="id"
            styleClass="p-datatable-striped">

            <!-- Table Header -->
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 3rem"><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
                    <th *ngFor="let col of config.columns" [pSortableColumn]="col.sortable ? col.field : undefined">
                        <div class="flex items-center gap-1">
                            {{ col.header }}
                            <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
                        </div>
                    </th>
                    <th style="width: 8rem; text-align: center;">Actions</th>
                </tr>
            </ng-template>

            <!-- Table Body -->
            <ng-template pTemplate="body" let-item>
                <tr>
                    <td><p-tableCheckbox [value]="item"></p-tableCheckbox></td>
                    <td *ngFor="let col of config.columns">
                        <ng-container [ngSwitch]="col.type">
                            <span *ngSwitchCase="'boolean'">
                                <p-tag [severity]="item[col.field] ? 'success' : 'danger'" [value]="item[col.field] ? 'Active' : 'Inactive'"></p-tag>
                            </span>
                            <span *ngSwitchCase="'date'">
                                {{ item[col.field] | date:'mediumDate' }}
                            </span>
                            <span *ngSwitchDefault>
                                {{ item[col.field] }}
                            </span>
                        </ng-container>
                    </td>
                    <td class="text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button pButton icon="pi pi-pencil" class="p-button-text p-button-rounded p-button-sm text-blue-600" (click)="openEdit(item)"></button>
                            <button pButton icon="pi pi-trash" class="p-button-text p-button-rounded p-button-sm text-red-600" (click)="deleteItem(item)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td [attr.colspan]="config.columns.length + 2" class="text-center py-8 text-slate-500 dark:text-slate-400">
                        No records found. Click <strong>+ New</strong> to create one.
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <!-- Form Dialog -->
    <p-dialog 
        [(visible)]="dialogVisible" 
        [header]="isEditing ? 'Edit ' + config.title : 'New ' + config.title"
        [modal]="true" 
        [style]="{ width: '500px' }" 
        styleClass="p-fluid rounded-2xl">

        <div class="space-y-4 py-2">
            <div *ngFor="let field of config.formFields" class="flex flex-col gap-1.5">
                <label [for]="field.field" class="text-xs font-semibold text-slate-700 dark:text-slate-300">
                    {{ field.label }} <span *ngIf="field.required" class="text-red-500">*</span>
                </label>

                <ng-container [ngSwitch]="field.type">
                    <input *ngSwitchCase="'text'" pInputText [id]="field.field" [(ngModel)]="formData[field.field]" [placeholder]="field.placeholder || ''" class="w-full">
                    
                    <input *ngSwitchCase="'number'" pInputText type="number" [id]="field.field" [(ngModel)]="formData[field.field]" class="w-full">
                    
                    <textarea *ngSwitchCase="'textarea'" pTextarea [id]="field.field" [(ngModel)]="formData[field.field]" rows="3" class="w-full"></textarea>
                    
                    <p-select *ngSwitchCase="'dropdown'" [options]="field.options || []" [(ngModel)]="formData[field.field]" optionLabel="label" optionValue="value" placeholder="Select..." class="w-full"></p-select>

                    <p-datepicker *ngSwitchCase="'date'" [(ngModel)]="formData[field.field]" dateFormat="yy-mm-dd" appendTo="body" class="w-full"></p-datepicker>

                    <div *ngSwitchCase="'boolean'" class="flex items-center gap-2 mt-1">
                        <p-checkbox [(ngModel)]="formData[field.field]" [binary]="true" [inputId]="field.field"></p-checkbox>
                        <label [for]="field.field" class="text-sm cursor-pointer">Active / Enabled</label>
                    </div>
                </ng-container>
            </div>
        </div>

        <ng-template pTemplate="footer">
            <p-button label="Cancel" icon="pi pi-times" severity="secondary" [text]="true" (click)="dialogVisible = false"></p-button>
            <p-button label="Save Record" icon="pi pi-check" severity="primary" (click)="saveItem()"></p-button>
        </ng-template>
    </p-dialog>
</div>
